services:
  db:
    image: mysql:8.4
    container_name: mysql84

    restart: unless-stopped

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: task_manager
      MYSQL_USER: taskManagerUser
      MYSQL_PASSWORD: secret

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: